behaviors:
  RobotPickAndPlace:
    trainer_type: ppo
    
    # Hyperparameters
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    
    # Network architecture
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    
    # Reward signals
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      # Optional: Add curiosity for exploration
      curiosity:
        gamma: 0.99
        strength: 0.02
        network_settings:
          hidden_units: 128
          num_layers: 2
        learning_rate: 3.0e-4
    
    # Training settings
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 5
    checkpoint_interval: 100000
    
    # Threading (for parallel training)
    threaded: true

# Environment settings
environment_parameters:
  # You can add curriculum learning parameters here later
  # For example, gradually increasing difficulty